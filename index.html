<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NexoScanner">
<title>NexoScanner</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#0f1117;--surface:#1a1d27;--surface2:#232637;--border:#2e3147;
    --accent:#00d4aa;--accent2:#0098ff;--text:#f0f2ff;--muted:#6b7094;
    --danger:#ff4f6b;--warn:#ffb84f;
  }
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  html,body{height:100dvh}

  /* SCREENS */
  .screen{position:fixed;inset:0;height:100dvh;display:flex;flex-direction:column;transition:opacity .25s,transform .25s}
  .screen.hidden{opacity:0;pointer-events:none;transform:translateY(16px)}

  /* TOP BAR */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0}
  .topbar-title{font-size:17px;font-weight:600;letter-spacing:.3px}
  .topbar-brand{font-size:11px;color:var(--muted);letter-spacing:.5px}
  .topbar .logo{display:flex;align-items:center;gap:8px}
  .logo-mark{width:28px;height:28px;border:2px solid var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;position:relative}
  .logo-mark::before{content:'';position:absolute;width:14px;height:10px;border:1.5px solid var(--accent);border-radius:2px}
  .logo-mark::after{content:'';position:absolute;width:14px;height:1px;background:var(--accent);opacity:.5}

  /* BTN */
  .btn{border:none;border-radius:12px;padding:12px 20px;font-size:15px;font-weight:600;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn-primary{background:var(--accent);color:#0f1117}
  .btn-primary:active{transform:scale(.97);background:#00b890}
  .btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
  .btn-secondary:active{transform:scale(.97)}
  .btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
  .btn-danger:active{background:var(--danger);color:#fff}
  .btn-icon{width:44px;height:44px;padding:0;border-radius:50%;background:var(--surface2);color:var(--text);border:1px solid var(--border)}
  .btn-icon:active{transform:scale(.93)}

  /* HOME SCREEN */
  #screen-home{align-items:center;justify-content:center;gap:0;padding:24px}
  .home-hero{width:100%;max-width:320px;aspect-ratio:3/4;background:var(--surface);border-radius:20px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;margin-bottom:32px;position:relative;overflow:hidden}
  .home-hero-inner{width:65%;aspect-ratio:3/4;border:2px solid var(--accent);border-radius:8px;position:relative;display:flex;align-items:center;justify-content:center}
  .corner{position:absolute;width:14px;height:14px}
  .corner svg{width:100%;height:100%}
  .corner-tl{top:-1px;left:-1px}
  .corner-tr{top:-1px;right:-1px;transform:scaleX(-1)}
  .corner-bl{bottom:-1px;left:-1px;transform:scaleY(-1)}
  .corner-br{bottom:-1px;right:-1px;transform:scale(-1)}
  .scan-line{position:absolute;width:100%;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:scan 2.5s ease-in-out infinite;top:0}
  @keyframes scan{0%{top:0;opacity:0}20%{opacity:1}80%{opacity:1}100%{top:100%;opacity:0}}
  .home-lines{position:absolute;inset:0;opacity:.04}
  .home-cta{width:100%;max-width:320px;display:flex;flex-direction:column;gap:12px}
  .home-cta .btn{width:100%;padding:16px}
  .pages-count{font-size:13px;color:var(--muted);text-align:center;margin-top:4px}
  .home-footer{position:absolute;bottom:20px;font-size:11px;color:var(--muted);letter-spacing:.4px}
  .home-footer a{color:var(--accent);text-decoration:none}

  /* GALLERY (scanned pages) */
  #screen-home .gallery{width:100%;max-width:320px;margin-bottom:24px;display:none}
  #screen-home .gallery.has-pages{display:block}
  .gallery-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .gallery-scroll::-webkit-scrollbar{display:none}
  .gallery-thumb{flex-shrink:0;width:72px;height:96px;border-radius:8px;border:2px solid var(--border);overflow:hidden;position:relative;cursor:pointer}
  .gallery-thumb.active{border-color:var(--accent)}
  .gallery-thumb img{width:100%;height:100%;object-fit:cover}
  .gallery-thumb .del-thumb{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.7);border:none;color:#fff;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
  .gallery-label{font-size:12px;color:var(--muted);margin-bottom:8px}

  /* CAMERA SCREEN */
  #screen-camera{background:#000;position:relative;overflow:hidden}
  #video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:0;pointer-events:none}
  .camera-overlay{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;justify-content:space-between}
  .camera-guide{position:absolute;top:50%;left:50%;transform:translate(-50%,-54%);width:75%;aspect-ratio:.707;border:2px solid rgba(255,255,255,.3);border-radius:4px;pointer-events:none;z-index:2}
  .camera-guide::before,.camera-guide::after{content:'';position:absolute;width:20px;height:20px;border-color:var(--accent);border-style:solid}
  .camera-guide::before{top:-2px;left:-2px;border-width:3px 0 0 3px}
  .camera-guide::after{top:-2px;right:-2px;border-width:3px 3px 0 0}
  .cam-bottom{position:relative;z-index:20;padding:24px 24px calc(48px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;background:linear-gradient(transparent,rgba(0,0,0,.85));pointer-events:auto}
  .shutter{width:72px;height:72px;border-radius:50%;background:#fff;border:4px solid rgba(255,255,255,.4);cursor:pointer;transition:transform .1s;-webkit-appearance:none;appearance:none;outline:none;pointer-events:auto;touch-action:manipulation}
  .shutter:active{transform:scale(.93)}
  .shutter-ring{width:72px;height:72px;border-radius:50%;border:3px solid rgba(255,255,255,.6);position:absolute;animation:pulse-ring 2s ease-out infinite;pointer-events:none}
  @keyframes pulse-ring{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.4);opacity:0}}
  .cam-top{position:relative;z-index:20;padding:52px 18px 16px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(rgba(0,0,0,.7),transparent);pointer-events:auto}
  .flash-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;cursor:pointer;-webkit-appearance:none;pointer-events:auto;touch-action:manipulation}
  .flash-btn.on{background:var(--warn);color:#000;border-color:var(--warn)}
  .cam-btn-icon{width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:0;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-appearance:none;outline:none;pointer-events:auto;touch-action:manipulation}
  .cam-btn-icon:active{transform:scale(.92);background:rgba(255,255,255,.2)}
  .cam-btn-icon svg,.shutter svg,.flash-btn svg{pointer-events:none}

  /* CROP SCREEN */
  #screen-crop{background:#111}
  #screen-crop .topbar{background:#111;border-color:#222}
  .crop-canvas-wrap{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:16px;position:relative}
  #canvas-crop{max-width:100%;max-height:100%;touch-action:none;cursor:crosshair;border-radius:4px}
  .crop-hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:12px;color:rgba(255,255,255,.5);background:rgba(0,0,0,.5);padding:5px 12px;border-radius:20px;white-space:nowrap}
  .crop-actions{display:flex;gap:10px;padding:14px 16px;flex-shrink:0}
  .crop-actions .btn{flex:1}

  /* ADJUST SCREEN */
  #screen-adjust{overflow-y:auto}
  #screen-adjust .topbar{flex-shrink:0;position:sticky;top:0;z-index:10}
  .adjust-preview{width:100%;background:#111;display:flex;align-items:center;justify-content:center;padding:20px;min-height:280px}
  #canvas-adjust{max-width:100%;max-height:320px;border-radius:6px;box-shadow:0 8px 32px rgba(0,0,0,.6)}
  .adjust-controls{padding:20px 18px;display:flex;flex-direction:column;gap:20px}
  .filter-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .filter-row::-webkit-scrollbar{display:none}
  .filter-btn{flex-shrink:0;padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);font-size:13px;cursor:pointer;transition:all .15s}
  .filter-btn.active{background:var(--accent);color:#0f1117;border-color:var(--accent)}
  .slider-group{display:flex;flex-direction:column;gap:8px}
  .slider-label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
  .slider-label span:last-child{color:var(--text);font-weight:500;min-width:30px;text-align:right}
  input[type=range]{width:100%;height:4px;-webkit-appearance:none;appearance:none;background:var(--border);border-radius:2px;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 2px 8px rgba(0,212,170,.4)}
  .adjust-actions{display:flex;gap:10px;padding:0 18px 32px;flex-shrink:0}
  .adjust-actions .btn{flex:1}

  /* TOAST */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:10px 20px;border-radius:24px;font-size:14px;transition:transform .3s;z-index:999;white-space:nowrap}
  .toast.show{transform:translateX(-50%) translateY(0)}

  /* LOADER */
  .loader-overlay{position:fixed;inset:0;background:rgba(15,17,23,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:998;opacity:0;pointer-events:none;transition:opacity .2s}
  .loader-overlay.show{opacity:1;pointer-events:all}
  .spinner{width:44px;height:44px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loader-text{font-size:14px;color:var(--muted)}

  canvas{display:block}
</style>
</head>
<body>

<!-- HOME -->
<div class="screen" id="screen-home">
  <div class="topbar">
    <div class="logo">
      <div class="logo-mark"></div>
      <span class="topbar-title">NexoScanner</span>
    </div>
    <span class="topbar-brand">por Nexosur</span>
  </div>

  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:0">

    <div class="gallery" id="gallery">
      <div class="gallery-label" id="gallery-label">Páginas escaneadas</div>
      <div class="gallery-scroll" id="gallery-scroll"></div>
    </div>

    <div class="home-hero" id="home-hero">
      <svg class="home-lines" viewBox="0 0 300 400"><defs><pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0L0 0 0 30" fill="none" stroke="white" stroke-width=".5"/></pattern></defs><rect width="300" height="400" fill="url(#g)"/></svg>
      <div class="home-hero-inner">
        <div class="corner corner-tl"><svg viewBox="0 0 14 14"><path d="M1 13V1h12" fill="none" stroke="#00d4aa" stroke-width="2.5" stroke-linecap="round"/></svg></div>
        <div class="corner corner-tr"><svg viewBox="0 0 14 14"><path d="M1 13V1h12" fill="none" stroke="#00d4aa" stroke-width="2.5" stroke-linecap="round"/></svg></div>
        <div class="corner corner-bl"><svg viewBox="0 0 14 14"><path d="M1 13V1h12" fill="none" stroke="#00d4aa" stroke-width="2.5" stroke-linecap="round"/></svg></div>
        <div class="corner corner-br"><svg viewBox="0 0 14 14"><path d="M1 13V1h12" fill="none" stroke="#00d4aa" stroke-width="2.5" stroke-linecap="round"/></svg></div>
        <div class="scan-line"></div>
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#00d4aa" stroke-width="1.5" opacity=".4"><rect x="5" y="3" width="14" height="18" rx="2"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="11" x2="16" y2="11"/><line x1="8" y1="14" x2="13" y2="14"/></svg>
      </div>
    </div>

    <div class="home-cta">
      <button class="btn btn-primary" id="btn-scan" onclick="startCamera()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="4"/><path d="M9 2h6l2 2h3a1 1 0 011 1v14a1 1 0 01-1 1H4a1 1 0 01-1-1V5a1 1 0 011-1h3z"/></svg>
        Escanear documento
      </button>
      <button class="btn btn-secondary" id="btn-upload" onclick="document.getElementById('file-input').click()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Cargar imagen
      </button>
      <button class="btn btn-primary" id="btn-pdf" onclick="exportPDF()" style="background:var(--accent2);display:none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="12" x2="12" y2="18"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
        Exportar PDF
      </button>
      <button class="btn btn-danger" id="btn-clear" onclick="clearAll()" style="display:none">Borrar todo</button>
      <button class="btn btn-secondary" id="btn-install" onclick="installPWA()" style="display:none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v13M8 11l4 4 4-4"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
        Instalar app
      </button>
      <p class="pages-count" id="pages-count"></p>
    </div>
  </div>

  <div id="ios-install-hint" style="display:none;position:absolute;bottom:44px;left:16px;right:16px;background:#1a1d27;border:1px solid #2e3147;border-radius:14px;padding:12px 16px;font-size:13px;color:#a0a3b8;text-align:center;line-height:1.5">
    Para instalar: tocá <svg style="vertical-align:-4px;margin:0 2px" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0098ff" stroke-width="2"><path d="M12 2v13M8 7l4-5 4 5"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg> y elegí <strong style="color:#f0f2ff">"Agregar a inicio"</strong>
  </div>
  <div class="home-footer">
    Sin publicidad &mdash; <a href="https://nexosurdigital.com.ar" target="_blank">nexosurdigital.com.ar</a>
  </div>
</div>

<!-- CAMERA -->
<div class="screen hidden" id="screen-camera">
  <video id="video" autoplay playsinline muted></video>
  <div class="camera-overlay">
    <div class="cam-top">
      <button class="flash-btn" id="flash-btn">⚡ Flash</button>
      <button class="cam-btn-icon" id="btn-cam-close">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="camera-guide"></div>
    <div class="cam-bottom">
      <button class="cam-btn-icon" id="btn-cam-gallery">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>
      </button>
      <div style="position:relative;display:flex;align-items:center;justify-content:center">
        <div class="shutter-ring"></div>
        <button class="shutter" id="shutter"></button>
      </div>
      <button class="cam-btn-icon" id="btn-cam-switch">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"/></svg>
      </button>
    </div>
  </div>
  <canvas id="canvas-capture" style="display:none"></canvas>
</div>

<!-- CROP -->
<div class="screen hidden" id="screen-crop">
  <div class="topbar">
    <button class="btn-icon" onclick="goHome()" style="font-size:18px">←</button>
    <span class="topbar-title">Ajustar recorte</span>
    <button class="btn btn-primary" onclick="applyCrop()" style="padding:8px 18px;font-size:14px">Continuar</button>
  </div>
  <div class="crop-canvas-wrap">
    <canvas id="canvas-crop"></canvas>
    <div class="crop-hint">Arrastrá las esquinas para ajustar</div>
  </div>
  <div class="crop-actions">
    <button class="btn btn-secondary" onclick="resetCropPoints()">Restablecer</button>
    <button class="btn btn-secondary" onclick="rotateImage()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21.5 2v6h-6M2.5 22v-6h6"/><path d="M22 13A10 10 0 113.22 7.5"/></svg>
      Rotar
    </button>
  </div>
</div>

<!-- ADJUST -->
<div class="screen hidden" id="screen-adjust">
  <div class="topbar">
    <button class="btn-icon" onclick="showScreen('screen-crop')" style="font-size:18px">←</button>
    <span class="topbar-title">Ajustar imagen</span>
    <button class="btn btn-primary" onclick="savePage()" style="padding:8px 18px;font-size:14px">Guardar</button>
  </div>
  <div class="adjust-preview">
    <canvas id="canvas-adjust"></canvas>
  </div>
  <div class="adjust-controls">
    <div class="filter-row">
      <button class="filter-btn active" data-filter="original" onclick="setFilter(this)">Original</button>
      <button class="filter-btn" data-filter="document" onclick="setFilter(this)">Documento</button>
      <button class="filter-btn" data-filter="bw" onclick="setFilter(this)">Blanco y negro</button>
      <button class="filter-btn" data-filter="vivid" onclick="setFilter(this)">Vívido</button>
    </div>
    <div class="slider-group">
      <div class="slider-label"><span>Brillo</span><span id="lbl-brightness">0</span></div>
      <input type="range" id="sl-brightness" min="-100" max="100" value="0" oninput="updateAdjust()">
    </div>
    <div class="slider-group">
      <div class="slider-label"><span>Contraste</span><span id="lbl-contrast">0</span></div>
      <input type="range" id="sl-contrast" min="-100" max="100" value="0" oninput="updateAdjust()">
    </div>
    <div class="slider-group">
      <div class="slider-label"><span>Saturación</span><span id="lbl-saturation">0</span></div>
      <input type="range" id="sl-saturation" min="-100" max="100" value="0" oninput="updateAdjust()">
    </div>
    <div class="slider-group">
      <div class="slider-label"><span>Nitidez</span><span id="lbl-sharpen">0</span></div>
      <input type="range" id="sl-sharpen" min="0" max="100" value="0" oninput="updateAdjust()">
    </div>
  </div>
  <div class="adjust-actions">
    <button class="btn btn-secondary" onclick="resetAdjust()">Restablecer</button>
  </div>
</div>

<input type="file" id="file-input" accept="image/*" style="display:none" onchange="handleFileInput(event)">
<div class="toast" id="toast"></div>
<div class="loader-overlay" id="loader"><div class="spinner"></div><div class="loader-text" id="loader-text">Procesando...</div></div>

<script>
// ─── STATE ───────────────────────────────────────────────
let pages = [];          // { dataUrl, thumb }
let currentImg = null;   // ImageBitmap of captured photo
let croppedCanvas = null;
let cropPoints = null;
let rotation = 0;
let currentFilter = 'original';
let stream = null;
let facingMode = 'environment';
let torchOn = false;

// ─── SCREEN NAV ──────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}
function goHome() {
  stopCamera();
  showScreen('screen-home');
  updateHomeUI();
}

// ─── CAMERA ──────────────────────────────────────────────
function tapHandler(el, fn) {
  // Use pointerup which works on all modern browsers and avoids 300ms delay.
  // Guard against duplicate firing if both pointerup and click bubble through.
  let busy = false;
  const run = (e) => {
    if (busy) return;
    busy = true;
    setTimeout(() => { busy = false; }, 400);
    if (e && e.preventDefault) e.preventDefault();
    try { fn(); } catch(err) { console.error('tap error:', err); toast('Error: ' + err.message); }
  };
  el.addEventListener('pointerup', run);
  el.addEventListener('click', run);
}

async function startCamera() {
  showScreen('screen-camera');
  const shutter = document.getElementById('shutter');
  if (!shutter._bound) {
    tapHandler(shutter,                                    capturePhoto);
    tapHandler(document.getElementById('btn-cam-close'),   goHome);
    tapHandler(document.getElementById('btn-cam-switch'),  switchCamera);
    tapHandler(document.getElementById('flash-btn'),       toggleFlash);
    tapHandler(document.getElementById('btn-cam-gallery'), () => document.getElementById('file-input').click());
    shutter._bound = true;
  }
  await openCamera();
}

async function openCamera() {
  try {
    if (stream) { stream.getTracks().forEach(t => t.stop()); }
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    document.getElementById('video').srcObject = stream;
  } catch(e) {
    toast('No se pudo acceder a la cámara');
    goHome();
  }
}

function stopCamera() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
}

async function switchCamera() {
  facingMode = facingMode === 'environment' ? 'user' : 'environment';
  await openCamera();
}

async function toggleFlash() {
  const track = stream?.getVideoTracks()[0];
  if (!track) return;
  try {
    torchOn = !torchOn;
    await track.applyConstraints({ advanced: [{ torch: torchOn }] });
    document.getElementById('flash-btn').classList.toggle('on', torchOn);
  } catch(e) { toast('Flash no disponible'); }
}

function capturePhoto() {
  const video = document.getElementById('video');
  const c = document.getElementById('canvas-capture');
  c.width = video.videoWidth;
  c.height = video.videoHeight;
  c.getContext('2d').drawImage(video, 0, 0);
  stopCamera();
  loadImageForCrop(c.toDataURL('image/jpeg', .92));
}

// ─── FILE INPUT ──────────────────────────────────────────
function handleFileInput(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    stopCamera();
    loadImageForCrop(ev.target.result);
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

// ─── CROP ─────────────────────────────────────────────────
let cropCanvas, cropCtx, cropImg, imgW, imgH, scale, offsetX, offsetY;
let dragging = -1;

function loadImageForCrop(dataUrl) {
  const img = new Image();
  img.onload = () => {
    cropImg = img;
    rotation = 0;
    showScreen('screen-crop');
    initCrop();
  };
  img.src = dataUrl;
}

function initCrop() {
  cropCanvas = document.getElementById('canvas-crop');
  cropCtx = cropCanvas.getContext('2d');
  const wrap = document.querySelector('.crop-canvas-wrap');
  const maxW = wrap.clientWidth - 32;
  const maxH = wrap.clientHeight - 48;
  scale = Math.min(maxW / cropImg.width, maxH / cropImg.height, 1);
  cropCanvas.width = Math.round(cropImg.width * scale);
  cropCanvas.height = Math.round(cropImg.height * scale);
  imgW = cropCanvas.width; imgH = cropCanvas.height;
  resetCropPoints();
  renderCrop();
  setupCropEvents();
}

function resetCropPoints() {
  const m = 0.05;
  cropPoints = [
    { x: imgW * m,       y: imgH * m },
    { x: imgW * (1-m),   y: imgH * m },
    { x: imgW * (1-m),   y: imgH * (1-m) },
    { x: imgW * m,       y: imgH * (1-m) }
  ];
  renderCrop();
}

function rotateImage() {
  rotation = (rotation + 90) % 360;
  const tmp = new OffscreenCanvas(cropImg.width, cropImg.height);
  // swap dims
  const rw = rotation % 180 === 0 ? cropImg.width : cropImg.height;
  const rh = rotation % 180 === 0 ? cropImg.height : cropImg.width;
  const rc = new OffscreenCanvas(rw, rh);
  const rx = rc.getContext('2d');
  rx.save();
  rx.translate(rw/2, rh/2);
  rx.rotate(rotation * Math.PI/180);
  rx.drawImage(cropImg, -cropImg.width/2, -cropImg.height/2);
  rx.restore();
  rc.convertToBlob().then(blob => {
    const url = URL.createObjectURL(blob);
    const img2 = new Image();
    img2.onload = () => { cropImg = img2; rotation = 0; initCrop(); URL.revokeObjectURL(url); };
    img2.src = url;
  });
}

function renderCrop() {
  cropCtx.clearRect(0, 0, imgW, imgH);
  cropCtx.drawImage(cropImg, 0, 0, imgW, imgH);
  // overlay
  cropCtx.fillStyle = 'rgba(0,0,0,.45)';
  cropCtx.fillRect(0, 0, imgW, imgH);
  // clip region
  cropCtx.save();
  cropCtx.beginPath();
  cropCtx.moveTo(cropPoints[0].x, cropPoints[0].y);
  cropPoints.forEach((p,i) => { if(i) cropCtx.lineTo(p.x, p.y); });
  cropCtx.closePath();
  cropCtx.clip();
  cropCtx.drawImage(cropImg, 0, 0, imgW, imgH);
  cropCtx.restore();
  // border
  cropCtx.beginPath();
  cropCtx.moveTo(cropPoints[0].x, cropPoints[0].y);
  cropPoints.forEach((p,i) => { if(i) cropCtx.lineTo(p.x, p.y); });
  cropCtx.closePath();
  cropCtx.strokeStyle = '#00d4aa';
  cropCtx.lineWidth = 2;
  cropCtx.stroke();
  // handles
  cropPoints.forEach((p,i) => {
    cropCtx.beginPath();
    cropCtx.arc(p.x, p.y, 14, 0, Math.PI*2);
    cropCtx.fillStyle = i === dragging ? '#00d4aa' : 'rgba(0,212,170,.25)';
    cropCtx.fill();
    cropCtx.strokeStyle = '#00d4aa';
    cropCtx.lineWidth = 2.5;
    cropCtx.stroke();
  });
}

function getPointerPos(e) {
  const rect = cropCanvas.getBoundingClientRect();
  const src = e.touches ? e.touches[0] : e;
  return {
    x: (src.clientX - rect.left) * (imgW / rect.width),
    y: (src.clientY - rect.top)  * (imgH / rect.height)
  };
}

function setupCropEvents() {
  cropCanvas.onmousedown  = e => startDrag(getPointerPos(e));
  cropCanvas.ontouchstart = e => { e.preventDefault(); startDrag(getPointerPos(e)); };
  cropCanvas.onmousemove  = e => moveDrag(getPointerPos(e));
  cropCanvas.ontouchmove  = e => { e.preventDefault(); moveDrag(getPointerPos(e)); };
  cropCanvas.onmouseup    = endDrag;
  cropCanvas.ontouchend   = endDrag;
}

function startDrag(pos) {
  dragging = cropPoints.findIndex(p => Math.hypot(p.x-pos.x, p.y-pos.y) < 30);
}
function moveDrag(pos) {
  if (dragging < 0) return;
  cropPoints[dragging].x = Math.max(0, Math.min(imgW, pos.x));
  cropPoints[dragging].y = Math.max(0, Math.min(imgH, pos.y));
  renderCrop();
}
function endDrag() { dragging = -1; renderCrop(); }

function applyCrop() {
  // Perspective transform using homography
  const pts = cropPoints;
  const w = Math.max(
    Math.hypot(pts[1].x-pts[0].x, pts[1].y-pts[0].y),
    Math.hypot(pts[2].x-pts[3].x, pts[2].y-pts[3].y)
  );
  const h = Math.max(
    Math.hypot(pts[3].x-pts[0].x, pts[3].y-pts[0].y),
    Math.hypot(pts[2].x-pts[1].x, pts[2].y-pts[1].y)
  );
  const dstW = Math.round(w / scale);
  const dstH = Math.round(h / scale);
  // src points in original image coords
  const src = pts.map(p => ({ x: p.x / scale, y: p.y / scale }));
  const dst = [
    {x:0,y:0},{x:dstW,y:0},{x:dstW,y:dstH},{x:0,y:dstH}
  ];
  const out = perspectiveTransform(cropImg, src, dst, dstW, dstH);
  croppedCanvas = out;
  initAdjust();
  showScreen('screen-adjust');
}

// Simple perspective transform via inverse mapping
function perspectiveTransform(img, src, dst, outW, outH) {
  const c = document.createElement('canvas');
  c.width = outW; c.height = outH;
  const ctx = c.getContext('2d');
  // Compute homography matrix (src->dst inverse = dst->src)
  const H = computeHomography(dst, src);
  // Draw using pixel-by-pixel inverse mapping (chunked for performance)
  // For speed, draw original and use clip path approximation for mobile
  // Full homography pixel mapping
  const imageData = ctx.createImageData(outW, outH);
  const tmp = document.createElement('canvas');
  tmp.width = img.width; tmp.height = img.height;
  const tctx = tmp.getContext('2d');
  tctx.drawImage(img, 0, 0);
  const srcData = tctx.getImageData(0, 0, img.width, img.height);
  const sw = img.width, sh = img.height;
  const d = imageData.data;
  const s = srcData.data;
  for (let y = 0; y < outH; y++) {
    for (let x = 0; x < outW; x++) {
      const [sx, sy] = applyH(H, x, y);
      const sx0 = Math.round(sx), sy0 = Math.round(sy);
      if (sx0 >= 0 && sx0 < sw && sy0 >= 0 && sy0 < sh) {
        const si = (sy0 * sw + sx0) * 4;
        const di = (y * outW + x) * 4;
        d[di]   = s[si];
        d[di+1] = s[si+1];
        d[di+2] = s[si+2];
        d[di+3] = 255;
      }
    }
  }
  ctx.putImageData(imageData, 0, 0);
  return c;
}

function computeHomography(src, dst) {
  // 4-point DLT
  const A = [];
  for (let i = 0; i < 4; i++) {
    const sx = src[i].x, sy = src[i].y;
    const dx = dst[i].x, dy = dst[i].y;
    A.push([-sx,-sy,-1,0,0,0,dx*sx,dx*sy,dx]);
    A.push([0,0,0,-sx,-sy,-1,dy*sx,dy*sy,dy]);
  }
  const h = svdSolve(A);
  return [[h[0],h[1],h[2]],[h[3],h[4],h[5]],[h[6],h[7],1]];
}

function applyH(H, x, y) {
  const w = H[2][0]*x + H[2][1]*y + H[2][2];
  return [(H[0][0]*x + H[0][1]*y + H[0][2])/w, (H[1][0]*x + H[1][1]*y + H[1][2])/w];
}

// Simple least-squares via Gaussian elimination (9x9)
function svdSolve(A) {
  const n = 8;
  // Add constraint h[8]=1 → move last col to rhs
  const M = A.map(row => row.slice(0, n).concat([-row[8]]));
  // Gaussian elimination
  for (let col = 0; col < n; col++) {
    let maxRow = col;
    for (let r = col+1; r < M.length; r++) if (Math.abs(M[r][col]) > Math.abs(M[maxRow][col])) maxRow = r;
    [M[col], M[maxRow]] = [M[maxRow], M[col]];
    const piv = M[col][col];
    if (Math.abs(piv) < 1e-12) continue;
    for (let r = col+1; r < M.length; r++) {
      const f = M[r][col] / piv;
      for (let c = col; c <= n; c++) M[r][c] -= f * M[col][c];
    }
  }
  const x = new Array(n).fill(0);
  for (let i = n-1; i >= 0; i--) {
    x[i] = M[i][n];
    for (let j = i+1; j < n; j++) x[i] -= M[i][j] * x[j];
    x[i] /= M[i][i];
  }
  return [...x, 1];
}

// ─── ADJUST ──────────────────────────────────────────────
let adjustCanvas, adjustCtx;

function initAdjust() {
  adjustCanvas = document.getElementById('canvas-adjust');
  adjustCtx = adjustCanvas.getContext('2d', { willReadFrequently: true });
  const maxW = window.innerWidth - 40;
  const maxH = 320;
  const s = Math.min(maxW / croppedCanvas.width, maxH / croppedCanvas.height, 1);
  adjustCanvas.width  = Math.round(croppedCanvas.width * s);
  adjustCanvas.height = Math.round(croppedCanvas.height * s);
  resetAdjust();
}

function resetAdjust() {
  document.getElementById('sl-brightness').value = 0;
  document.getElementById('sl-contrast').value = 0;
  document.getElementById('sl-saturation').value = 0;
  document.getElementById('sl-sharpen').value = 0;
  currentFilter = 'original';
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === 'original'));
  updateAdjust();
}

function setFilter(btn) {
  currentFilter = btn.dataset.filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  // Auto-set sliders per filter
  const presets = {
    original: [0, 0, 0, 0],
    document: [15, 40, -80, 30],
    bw: [10, 30, -100, 20],
    vivid: [5, 20, 50, 10]
  };
  const [br, co, sa, sh] = presets[currentFilter];
  document.getElementById('sl-brightness').value = br;
  document.getElementById('sl-contrast').value = co;
  document.getElementById('sl-saturation').value = sa;
  document.getElementById('sl-sharpen').value = sh;
  updateLabels();
  updateAdjust();
}

function updateLabels() {
  ['brightness','contrast','saturation','sharpen'].forEach(id => {
    document.getElementById('lbl-'+id).textContent = document.getElementById('sl-'+id).value;
  });
}

function updateAdjust() {
  updateLabels();
  adjustCtx.drawImage(croppedCanvas, 0, 0, adjustCanvas.width, adjustCanvas.height);
  const brightness = parseInt(document.getElementById('sl-brightness').value);
  const contrast   = parseInt(document.getElementById('sl-contrast').value);
  const saturation = parseInt(document.getElementById('sl-saturation').value);
  const sharpen    = parseInt(document.getElementById('sl-sharpen').value);
  applyFilters(adjustCtx, adjustCanvas.width, adjustCanvas.height, brightness, contrast, saturation, sharpen);
}

function applyFilters(ctx, w, h, brightness, contrast, saturation, sharpen) {
  const imgData = ctx.getImageData(0, 0, w, h);
  const d = imgData.data;
  const br = brightness * 2.55;
  const co = (259 * (contrast + 255)) / (255 * (259 - contrast));
  const sa = (saturation + 100) / 100;
  for (let i = 0; i < d.length; i += 4) {
    let r = d[i], g = d[i+1], b = d[i+2];
    // brightness
    r += br; g += br; b += br;
    // contrast
    r = co*(r-128)+128; g = co*(g-128)+128; b = co*(b-128)+128;
    // saturation
    const gray = 0.299*r + 0.587*g + 0.114*b;
    r = gray + sa*(r-gray);
    g = gray + sa*(g-gray);
    b = gray + sa*(b-gray);
    d[i]   = Math.max(0,Math.min(255,r));
    d[i+1] = Math.max(0,Math.min(255,g));
    d[i+2] = Math.max(0,Math.min(255,b));
  }
  ctx.putImageData(imgData, 0, 0);
  // Unsharp mask approximation
  if (sharpen > 0) {
    const amount = sharpen / 100;
    const blurred = ctx.getImageData(0, 0, w, h);
    // box blur pass
    blurImageData(blurred, w, h, 1);
    const sharp = ctx.getImageData(0, 0, w, h);
    for (let i = 0; i < sharp.data.length; i += 4) {
      for (let c = 0; c < 3; c++) {
        sharp.data[i+c] = Math.max(0,Math.min(255,
          sharp.data[i+c] + amount * (sharp.data[i+c] - blurred.data[i+c]) * 3
        ));
      }
    }
    ctx.putImageData(sharp, 0, 0);
  }
}

function blurImageData(imgData, w, h, r) {
  const d = imgData.data;
  const tmp = new Uint8ClampedArray(d);
  for (let y = r; y < h-r; y++) {
    for (let x = r; x < w-r; x++) {
      for (let c = 0; c < 3; c++) {
        let sum = 0, cnt = 0;
        for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
          sum += tmp[((y+dy)*w+(x+dx))*4+c]; cnt++;
        }
        d[(y*w+x)*4+c] = sum/cnt;
      }
    }
  }
}

// ─── SAVE PAGE ───────────────────────────────────────────
function savePage() {
  // Render final at full resolution
  const finalCanvas = document.createElement('canvas');
  finalCanvas.width  = croppedCanvas.width;
  finalCanvas.height = croppedCanvas.height;
  const fctx = finalCanvas.getContext('2d', { willReadFrequently: true });
  fctx.drawImage(croppedCanvas, 0, 0);
  const brightness = parseInt(document.getElementById('sl-brightness').value);
  const contrast   = parseInt(document.getElementById('sl-contrast').value);
  const saturation = parseInt(document.getElementById('sl-saturation').value);
  const sharpen    = parseInt(document.getElementById('sl-sharpen').value);
  applyFilters(fctx, finalCanvas.width, finalCanvas.height, brightness, contrast, saturation, sharpen);
  const dataUrl = finalCanvas.toDataURL('image/jpeg', .92);
  const thumb   = finalCanvas.toDataURL('image/jpeg', .3);
  pages.push({ dataUrl, thumb });
  goHome();
  toast(`Página ${pages.length} guardada`);
}

// ─── HOME UI ─────────────────────────────────────────────
function updateHomeUI() {
  const hasPages = pages.length > 0;
  document.getElementById('btn-pdf').style.display   = hasPages ? '' : 'none';
  document.getElementById('btn-clear').style.display = hasPages ? '' : 'none';
  document.getElementById('pages-count').textContent = hasPages ? `${pages.length} página${pages.length > 1 ? 's' : ''} lista${pages.length > 1 ? 's' : ''}` : '';
  document.getElementById('home-hero').style.display = hasPages ? 'none' : '';
  const gallery = document.getElementById('gallery');
  gallery.classList.toggle('has-pages', hasPages);
  const scroll = document.getElementById('gallery-scroll');
  scroll.innerHTML = '';
  pages.forEach((p, i) => {
    const div = document.createElement('div');
    div.className = 'gallery-thumb';
    div.innerHTML = `<img src="${p.thumb}"><button class="del-thumb" onclick="deletePage(${i})">✕</button>`;
    scroll.appendChild(div);
  });
  document.getElementById('gallery-label').textContent = `${pages.length} página${pages.length > 1 ? 's' : ''} escaneada${pages.length > 1 ? 's' : ''}`;
  // iOS install hint: show if standalone not active and iOS detected
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isStandalone = window.navigator.standalone === true;
  const iosHint = document.getElementById('ios-install-hint');
  if (iosHint) iosHint.style.display = (isIOS && !isStandalone) ? '' : 'none';
}

function deletePage(i) {
  pages.splice(i, 1);
  updateHomeUI();
}

function clearAll() {
  if (pages.length === 0) return;
  pages = [];
  updateHomeUI();
  toast('Se borraron todas las páginas');
}

// ─── PDF EXPORT ──────────────────────────────────────────
async function exportPDF() {
  if (pages.length === 0) return;
  showLoader('Generando PDF...');
  await delay(100);
  try {
    const { jsPDF } = window.jspdf;
    let doc = null;
    for (let i = 0; i < pages.length; i++) {
      showLoader(`Procesando página ${i+1} de ${pages.length}...`);
      await delay(50);
      const img = new Image();
      await new Promise(r => { img.onload = r; img.src = pages[i].dataUrl; });
      const imgW = img.width, imgH = img.height;
      const isLandscape = imgW > imgH;
      const pdfW = isLandscape ? 297 : 210;
      const pdfH = isLandscape ? 210 : 297;
      if (!doc) {
        doc = new jsPDF({ orientation: isLandscape ? 'l' : 'p', unit: 'mm', format: 'a4' });
      } else {
        doc.addPage([pdfW, pdfH], isLandscape ? 'l' : 'p');
      }
      const ratio = Math.min(pdfW / imgW, pdfH / imgH);
      const drawW = imgW * ratio;
      const drawH = imgH * ratio;
      const x = (pdfW - drawW) / 2;
      const y = (pdfH - drawH) / 2;
      doc.addImage(pages[i].dataUrl, 'JPEG', x, y, drawW, drawH);
    }
    const filename = `scan_${new Date().toISOString().slice(0,10)}_nexosur.pdf`;
    doc.save(filename);
    hideLoader();
    toast('PDF descargado');
  } catch(e) {
    hideLoader();
    toast('Error al generar PDF');
    console.error(e);
  }
}

// ─── UTILS ───────────────────────────────────────────────
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
function showLoader(msg) {
  document.getElementById('loader-text').textContent = msg || 'Procesando...';
  document.getElementById('loader').classList.add('show');
}
function hideLoader() { document.getElementById('loader').classList.remove('show'); }
function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

// ─── PWA ─────────────────────────────────────────────────
let deferredInstallPrompt = null;

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstallPrompt = e;
  document.getElementById('btn-install').style.display = '';
});

window.addEventListener('appinstalled', () => {
  deferredInstallPrompt = null;
  document.getElementById('btn-install').style.display = 'none';
  toast('App instalada correctamente');
});

function installPWA() {
  if (!deferredInstallPrompt) {
    toast('Usá "Agregar a pantalla de inicio" en el menú del navegador');
    return;
  }
  deferredInstallPrompt.prompt();
  deferredInstallPrompt.userChoice.then(() => {
    deferredInstallPrompt = null;
    document.getElementById('btn-install').style.display = 'none';
  });
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

// Init
updateHomeUI();
